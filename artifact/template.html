<title>Draft Night</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
  --bg: #f4f7f1;
  --surface: #ffffff;
  --surface-2: #eaf0e6;
  --line: #d7e0d2;
  --text: #10190f;
  --text-muted: #55645a;
  --accent: #b56a00;
  --accent-ink: #ffffff;
  --floodlight: #ffb62e;
  --good: #1f8a4c;
  --warn: #b5790a;
  --bad: #c8402c;
  --shadow: 0 1px 2px rgba(16, 25, 15, 0.06), 0 6px 20px rgba(16, 25, 15, 0.06);
  --radius: 14px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1310;
    --surface: #141f19;
    --surface-2: #1a2921;
    --line: #28392f;
    --text: #edf3ec;
    --text-muted: #97a99c;
    --accent: #ffb62e;
    --accent-ink: #1a1200;
    --floodlight: #ffb62e;
    --good: #35c073;
    --warn: #f0ab3d;
    --bad: #f0665a;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 30px rgba(0, 0, 0, 0.35);
  }
}
:root[data-theme="dark"] {
  --bg: #0c1310;
  --surface: #141f19;
  --surface-2: #1a2921;
  --line: #28392f;
  --text: #edf3ec;
  --text-muted: #97a99c;
  --accent: #ffb62e;
  --accent-ink: #1a1200;
  --floodlight: #ffb62e;
  --good: #35c073;
  --warn: #f0ab3d;
  --bad: #f0665a;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 30px rgba(0, 0, 0, 0.35);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'IBM Plex Sans', -apple-system, sans-serif;
}

.mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
.display { font-family: 'Big Shoulders Display', sans-serif; letter-spacing: 0.01em; }

/* ---------- Scoreboard header ---------- */
.scoreboard {
  background: linear-gradient(180deg, var(--surface) 0%, var(--surface) 100%);
  border-bottom: 1px solid var(--line);
  padding: 1.1rem 1.25rem 1rem;
}
.scoreboard-inner {
  max-width: 1180px;
  margin: 0 auto;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
}
.wordmark {
  font-family: 'Big Shoulders Display', sans-serif;
  font-weight: 900;
  font-size: 2rem;
  line-height: 0.9;
  text-transform: uppercase;
  letter-spacing: 0.01em;
  margin: 0;
}
.wordmark span { color: var(--floodlight); }
.gw-pill-row { display: flex; align-items: center; gap: 0.6rem; margin-top: 0.35rem; }
.gw-pill {
  font-family: 'Big Shoulders Display', sans-serif;
  font-weight: 800;
  font-size: 0.95rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  background: var(--floodlight);
  color: #1a1200;
  padding: 0.2rem 0.6rem;
  border-radius: 999px;
}
.data-asof { font-size: 0.76rem; color: var(--text-muted); }
.legend { display: flex; gap: 0.9rem; font-size: 0.72rem; color: var(--text-muted); flex-wrap: wrap; }
.legend b { color: var(--text); }

/* ---------- Controls ---------- */
.controls-wrap {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.controls {
  max-width: 1180px;
  margin: 0 auto;
  padding: 0.7rem 1.25rem;
  display: flex;
  flex-wrap: wrap;
  gap: 0.55rem;
  align-items: center;
}
.controls input, .controls select {
  font-family: inherit;
  font-size: 0.85rem;
  padding: 0.5rem 0.7rem;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
}
.controls input:focus, .controls select:focus, .tab:focus-visible, .player-card:focus-visible, .modal-close:focus-visible {
  outline: 2px solid var(--floodlight);
  outline-offset: 1px;
}
#search { flex: 1 1 180px; min-width: 140px; }
.tabs { display: flex; gap: 0.3rem; }
.tab {
  font-family: 'Big Shoulders Display', sans-serif;
  font-weight: 700;
  font-size: 0.85rem;
  letter-spacing: 0.03em;
  padding: 0.45rem 0.75rem;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text-muted);
  cursor: pointer;
}
.tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.result-count { font-size: 0.74rem; color: var(--text-muted); padding: 0 1.25rem; max-width: 1180px; margin: 0.5rem auto 0; }

/* ---------- Grid ---------- */
main { max-width: 1180px; margin: 0 auto; padding: 0.6rem 1.25rem 3rem; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 0.75rem;
  margin-top: 0.6rem;
}

.player-card {
  position: relative;
  display: grid;
  grid-template-columns: 6px 1fr auto;
  align-items: stretch;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  cursor: pointer;
  overflow: hidden;
  text-align: left;
  padding: 0;
}
.team-stripe { background: var(--stripe, var(--line)); }
.card-body { padding: 0.8rem 0.85rem; min-width: 0; }
.card-top-row { display: flex; align-items: baseline; gap: 0.4rem; }
.player-name { font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 1.15rem; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player-sub { font-size: 0.72rem; color: var(--text-muted); margin: 0.1rem 0 0; }
.card-stats { display: flex; gap: 0.9rem; margin-top: 0.55rem; }
.card-stat .k { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
.card-stat .v { font-size: 0.88rem; font-weight: 600; }
.fixture-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  margin-top: 0.55rem;
  font-size: 0.68rem;
  padding: 0.15rem 0.5rem;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--text);
}
.fdr-dot { width: 7px; height: 7px; border-radius: 50%; }
.avail-flag { display: block; margin-top: 0.4rem; font-size: 0.68rem; font-weight: 600; }

.score-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0 0.7rem;
  background: var(--surface-2);
  border-left: 1px solid var(--line);
  min-width: 62px;
}
.score-num { font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 1.9rem; line-height: 1; }
.score-max { font-size: 0.6rem; color: var(--text-muted); }

.empty-state { grid-column: 1/-1; text-align: center; padding: 3rem 1rem; color: var(--text-muted); }

/* ---------- Modal ---------- */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(8, 12, 8, 0.55);
  display: flex; align-items: flex-end; justify-content: center; z-index: 50; padding: 0;
}
.modal-backdrop[hidden] { display: none; }
@media (min-width: 640px) {
  .modal-backdrop { align-items: center; padding: 1rem; }
}
.modal {
  background: var(--surface);
  width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
  border-radius: 18px 18px 0 0;
  padding: 1.4rem 1.3rem 2rem;
  position: relative;
  box-shadow: var(--shadow);
}
@media (min-width: 640px) { .modal { border-radius: 18px; } }
.modal-close {
  position: absolute; top: 0.8rem; right: 0.8rem;
  width: 30px; height: 30px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
  font-size: 1rem; cursor: pointer;
}
.modal-head { display: flex; align-items: center; gap: 0.85rem; padding-right: 2rem; }
.avatar {
  width: 54px; height: 54px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 1.3rem;
  color: #fff; flex-shrink: 0;
}
.modal-head h2 { margin: 0; font-family: 'Big Shoulders Display', sans-serif; font-size: 1.5rem; font-weight: 800; }
.modal-sub { font-size: 0.78rem; color: var(--text-muted); margin: 0.15rem 0 0; }

.score-readout { display: flex; align-items: baseline; gap: 0.5rem; margin: 1rem 0 0.3rem; }
.score-readout .big { font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 2.6rem; line-height: 1; }
.score-readout .label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }

.breakdown-row { display: flex; align-items: center; gap: 0.6rem; margin: 0.35rem 0; font-size: 0.78rem; }
.breakdown-label { width: 128px; flex-shrink: 0; color: var(--text-muted); }
.breakdown-track { flex: 1; height: 7px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.breakdown-fill { height: 100%; background: var(--floodlight); }
.breakdown-value { width: 2rem; text-align: right; }

.news-banner {
  margin-top: 0.8rem; padding: 0.6rem 0.75rem; border-radius: 10px;
  background: color-mix(in srgb, var(--bad) 14%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--bad) 35%, var(--surface));
  color: var(--bad); font-size: 0.8rem;
}

.section-label {
  font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--text-muted); margin: 1.2rem 0 0.5rem;
}
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
.stat-tile { background: var(--surface-2); border-radius: 10px; padding: 0.55rem; text-align: center; }
.stat-tile .v { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 1.05rem; }
.stat-tile .k { font-size: 0.62rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 0.1rem; }

footer.credit { max-width: 1180px; margin: 0 auto; padding: 0 1.25rem 2rem; font-size: 0.7rem; color: var(--text-muted); }
</style>

<div class="scoreboard">
  <div class="scoreboard-inner">
    <div>
      <p class="wordmark">Draft<span>Night</span></p>
      <div class="gw-pill-row">
        <span class="gw-pill" id="gw-pill">GW —</span>
        <span class="data-asof" id="data-asof"></span>
      </div>
    </div>
    <div class="legend">
      <span><b>Score</b> = next-GW pick quality, 1&ndash;10</span>
      <span><b>FDR</b> = fixture difficulty</span>
    </div>
  </div>
</div>

<div class="controls-wrap">
  <div class="controls">
    <input id="search" type="search" placeholder="Search player…" autocomplete="off" />
    <select id="team-select"><option value="">All 20 clubs</option></select>
    <div class="tabs" id="pos-tabs">
      <button class="tab active" data-pos="">ALL</button>
      <button class="tab" data-pos="GKP">GKP</button>
      <button class="tab" data-pos="DEF">DEF</button>
      <button class="tab" data-pos="MID">MID</button>
      <button class="tab" data-pos="FWD">FWD</button>
    </div>
    <select id="sort-select">
      <option value="score">Sort: Score</option>
      <option value="form">Sort: Form</option>
      <option value="ep">Sort: Exp. pts</option>
      <option value="pts">Sort: Total pts</option>
      <option value="g">Sort: Goals</option>
      <option value="a">Sort: Assists</option>
      <option value="price">Sort: Price</option>
      <option value="sel">Sort: Popularity</option>
    </select>
  </div>
</div>

<p class="result-count" id="result-count"></p>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer class="credit">Player data snapshot — see the “data as of” note above. Attractiveness score blends expected points, form, fixture ease, consistency and availability.</footer>

<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <button class="modal-close" id="modal-close" aria-label="Close">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const DATA = __DATA__;
</script>
<script>
(function () {
  const teamsById = new Map(DATA.teams.map(t => [t.id, t]));
  const state = { team: "", pos: "", search: "", sort: "score" };

  const HUES = [4,20,34,48,64,88,110,140,160,178,196,212,230,250,268,286,308,330,350,10];
  function teamHue(teamId) {
    const idx = DATA.teams.findIndex(t => t.id === teamId);
    return HUES[idx % HUES.length];
  }
  function teamColor(teamId, l) {
    return 'hsl(' + teamHue(teamId) + ', 55%, ' + l + '%)';
  }

  function scoreColor(score) {
    if (score >= 8) return 'var(--good)';
    if (score >= 6) return '#5fae3d';
    if (score >= 4) return 'var(--warn)';
    if (score >= 2) return '#d97a3d';
    return 'var(--bad)';
  }
  function fdrColor(diff) {
    if (diff <= 2) return 'var(--good)';
    if (diff === 3) return 'var(--warn)';
    return 'var(--bad)';
  }
  function availClass(factor) {
    if (factor >= 1) return 'good';
    if (factor > 0.3) return 'warn';
    return 'bad';
  }
  function availColorVar(factor) {
    if (factor >= 1) return 'var(--good)';
    if (factor > 0.3) return 'var(--warn)';
    return 'var(--bad)';
  }

  const teamSelect = document.getElementById('team-select');
  DATA.teams.slice().sort((a,b) => a.name.localeCompare(b.name)).forEach(t => {
    const opt = document.createElement('option');
    opt.value = t.id; opt.textContent = t.name;
    teamSelect.appendChild(opt);
  });

  document.getElementById('gw-pill').textContent = DATA.nextEvent ? 'GW ' + DATA.nextEvent.id : 'Off-season';
  document.getElementById('data-asof').textContent = 'Player data as of ' + DATA.dataAsOf;

  const grid = document.getElementById('grid');
  const resultCount = document.getElementById('result-count');

  function sortField(p, key) {
    switch (key) {
      case 'form': return p.form;
      case 'ep': return p.ep;
      case 'pts': return p.pts;
      case 'g': return p.g;
      case 'a': return p.a;
      case 'price': return p.price;
      case 'sel': return p.sel;
      default: return p.score;
    }
  }

  function applyFilters() {
    let list = DATA.players;
    if (state.team) list = list.filter(p => p.t === Number(state.team));
    if (state.pos) list = list.filter(p => p.pos === state.pos);
    if (state.search) {
      const q = state.search.toLowerCase();
      list = list.filter(p => p.n.toLowerCase().includes(q) || p.fn.toLowerCase().includes(q));
    }
    list = list.slice().sort((a, b) => sortField(b, state.sort) - sortField(a, state.sort));
    return list;
  }

  function render() {
    const list = applyFilters();
    resultCount.textContent = list.length + ' player' + (list.length === 1 ? '' : 's');
    if (list.length === 0) {
      grid.innerHTML = '<p class="empty-state">No players match those filters.</p>';
      return;
    }
    grid.innerHTML = list.map(cardHtml).join('');
    grid.querySelectorAll('[data-id]').forEach(el => {
      el.addEventListener('click', () => openModal(Number(el.dataset.id)));
    });
  }

  function cardHtml(p) {
    const team = teamsById.get(p.t);
    const stripe = teamColor(p.t, 52);
    return '' +
      '<button class="player-card" data-id="' + p.id + '" style="--stripe:' + stripe + '">' +
        '<span class="team-stripe"></span>' +
        '<span class="card-body">' +
          '<span class="card-top-row"><span class="player-name">' + p.n + '</span></span>' +
          '<p class="player-sub">' + p.pos + ' · ' + (team ? team.shortName : '?') + ' · £' + p.price.toFixed(1) + 'm</p>' +
          '<span class="card-stats">' +
            '<span class="card-stat"><span class="k">Form</span><br><span class="v mono">' + p.form.toFixed(1) + '</span></span>' +
            '<span class="card-stat"><span class="k">Exp pts</span><br><span class="v mono">' + p.ep.toFixed(1) + '</span></span>' +
            '<span class="card-stat"><span class="k">Total</span><br><span class="v mono">' + p.pts + '</span></span>' +
          '</span>' +
          '<span class="fixture-chip"><span class="fdr-dot" style="background:' + (p.fix.entries[0] ? fdrColor(p.fix.entries[0].difficulty) : 'var(--text-muted)') + '"></span>' + p.fix.label + '</span><br/>' +
          '<span class="avail-flag" style="color:' + availColorVar(p.avail.factor) + '">' + p.avail.label + '</span>' +
        '</span>' +
        '<span class="score-col">' +
          '<span class="score-num" style="color:' + scoreColor(p.score) + '">' + p.score.toFixed(1) + '</span>' +
          '<span class="score-max">/ 10</span>' +
        '</span>' +
      '</button>';
  }

  function breakdownRow(label, value) {
    const pct = Math.max(0, Math.min(100, value * 10));
    return '<div class="breakdown-row"><span class="breakdown-label">' + label + '</span>' +
      '<span class="breakdown-track"><span class="breakdown-fill" style="width:' + pct + '%"></span></span>' +
      '<span class="breakdown-value mono">' + value.toFixed(1) + '</span></div>';
  }

  function openModal(id) {
    const p = DATA.players.find(x => x.id === id);
    const team = teamsById.get(p.t);
    const b = p.brk;
    const news = p.avail.news ? '<div class="news-banner">⚠ ' + p.avail.news + '</div>' : '';
    let statBoxes;
    if (p.pos === 'GKP') {
      statBoxes = [['Saves', p.sv], ['Clean sheets', p.cs], ['Conceded', p.gc]];
    } else if (p.pos === 'DEF') {
      statBoxes = [['Goals', p.g], ['Assists', p.a], ['Clean sheets', p.cs]];
    } else {
      statBoxes = [['Goals', p.g], ['Assists', p.a], ['Bonus', p.bonus]];
    }
    const initials = p.n.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
    document.getElementById('modal-body').innerHTML =
      '<div class="modal-head">' +
        '<span class="avatar" style="background:' + teamColor(p.t, 42) + '">' + initials + '</span>' +
        '<div><h2>' + p.fn + '</h2><p class="modal-sub">' + p.pos + ' · ' + (team ? team.name : '?') + ' · £' + p.price.toFixed(1) + 'm (' + p.trend + ')</p>' +
        '<p class="avail-flag" style="color:' + availColorVar(p.avail.factor) + '">' + p.avail.label + '</p></div>' +
      '</div>' +
      news +
      '<div class="score-readout"><span class="big display" style="color:' + scoreColor(p.score) + '">' + p.score.toFixed(1) + '</span><span class="label">/ 10 attractiveness</span></div>' +
      breakdownRow('Expected points', b.expectedPoints) +
      breakdownRow('Form', b.form) +
      breakdownRow('Fixture ease', b.fixtureEase) +
      breakdownRow('Consistency', b.consistency) +
      breakdownRow('Availability', b.availabilityFactor) +
      '<p class="section-label">Next fixture</p><p class="mono">' + p.fix.label + '</p>' +
      '<p class="section-label">Season stats</p>' +
      '<div class="stat-grid">' +
        '<div class="stat-tile"><div class="v">' + p.pts + '</div><div class="k">Points</div></div>' +
        '<div class="stat-tile"><div class="v">' + p.form.toFixed(1) + '</div><div class="k">Form</div></div>' +
        '<div class="stat-tile"><div class="v">' + p.ppg.toFixed(1) + '</div><div class="k">Pts/game</div></div>' +
        statBoxes.map(([k,v]) => '<div class="stat-tile"><div class="v">' + v + '</div><div class="k">' + k + '</div></div>').join('') +
        '<div class="stat-tile"><div class="v">' + p.mins + '</div><div class="k">Minutes</div></div>' +
        '<div class="stat-tile"><div class="v">' + p.sel.toFixed(1) + '%</div><div class="k">Selected</div></div>' +
      '</div>' +
      '<p class="section-label">ICT index</p>' +
      '<div class="stat-grid">' +
        '<div class="stat-tile"><div class="v">' + p.inf.toFixed(0) + '</div><div class="k">Influence</div></div>' +
        '<div class="stat-tile"><div class="v">' + p.cre.toFixed(0) + '</div><div class="k">Creativity</div></div>' +
        '<div class="stat-tile"><div class="v">' + p.thr.toFixed(0) + '</div><div class="k">Threat</div></div>' +
      '</div>';
    document.getElementById('modal-backdrop').hidden = false;
  }

  document.getElementById('search').addEventListener('input', e => { state.search = e.target.value.trim(); render(); });
  document.getElementById('team-select').addEventListener('change', e => { state.team = e.target.value; render(); });
  document.getElementById('sort-select').addEventListener('change', e => { state.sort = e.target.value; render(); });
  document.getElementById('pos-tabs').addEventListener('click', e => {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    state.pos = btn.dataset.pos;
    render();
  });
  document.getElementById('modal-close').addEventListener('click', () => { document.getElementById('modal-backdrop').hidden = true; });
  document.getElementById('modal-backdrop').addEventListener('click', e => {
    if (e.target.id === 'modal-backdrop') e.target.hidden = true;
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('modal-backdrop').hidden = true; });

  render();
})();
</script>
